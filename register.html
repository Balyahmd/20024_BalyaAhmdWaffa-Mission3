<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidio Belajar By Balya</title>

    <link rel="stylesheet" href="/assets/styles/style.css" />
  </head>
  <body>
    <header>
      <div class="logo-nav">
        <img src="assets/icons/logo.png" alt="logo-vidio-belajar" />
      </div>
    </header>
    <main>
      <section class="register-container">
        <article class="card register-card">
          <div class="header-register">
            <h3 class="title-register">Pendaftaran Akun</h3>
            <p class="subtitle-register">
              Yuk, daftarkan akunmu sekarang juga!
            </p>
          </div>
          <form action="">
            <div class="form-group">
              <label for="full-name">Nama Lengkap <span>*</span></label>
              <input type="text" id="full-name" name="full-name" required />
            </div>

            <div class="form-group">
              <label for="email">E-mail <span>*</span></label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="select-gender-mobile">
              <div class="form-group">
                <label for="email">Jenis Kelamin <span>*</span></label>
                <select name="" id="" class="select-gender">
                  <option value="man">Laki-laki</option>
                  <option value="women">Perempuan</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="number-phone">No. Hp<span>*</span></label>
              <div class="phone-group">
                <div class="country-code">
                  <div class="flag-wrapper">
                    <img src="assets/icons/country-indo.png" alt="Indonesia" />
                  </div>

                  <select name="select-code-country" id="">
                    <option value="+62">+62</option>
                    <option value="+62">+62</option>
                    <option value="+62">+62</option>
                  </select>
                </div>
                <input
                  type="tel"
                  name="number-phone"
                  id="number-phone"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Kata Sandi <span>*</span></label>
              <div class="password-wrapper">
                <input type="password" id="password" name="password" required />
                <button type="button" class="show-password">
                  <img src="assets/icons/mdi_eye-off.png" alt="" />
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="confirm-password"
                >Konfirmasi Kata Sandi <span>*</span></label
              >
              <div class="password-wrapper">
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  required
                />
                <button type="button" class="show-password">
                  <img src="assets/icons/mdi_eye-off.png" alt="" />
                </button>
              </div>
            </div>

            <p class="forget-password">Lupa Password?</p>
            <button type="submit" class="btn btn-login">Daftar</button>
            <button type="submit" class="btn btn-register">Masuk</button>
            <div class="separator">
              <span>atau</span>
            </div>
            <button type="button" class="btn btn-google">
              <div class="icon-google">
                <img
                  src="assets/icons/logos_google-icon.png"
                  alt="icon-google"
                />
              </div>
              Daftar dengan Google
            </button>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
